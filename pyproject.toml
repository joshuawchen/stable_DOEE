[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-doee"
version = "1.0.1"
description = "Regularized deconvolution of observation-error densities from ensemble innovations (DOEE)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Joshua Chen" }]
dependencies = ["numpy", "quadprog"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["matplotlib"]

[project.urls]
Repository = "https://github.com/joshuawchen/stable_DOEE"

# Only the two library modules are installed. The tests, scripts and
# examples are run from a clone.
[tool.setuptools]
py-modules = ["stable_doee", "stable_doee_reg"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
